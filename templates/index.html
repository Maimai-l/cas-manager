<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>CAS Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #ffffff; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter",
                 "Helvetica Neue", "Segoe UI", Roboto, system-ui, sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    letter-spacing: -0.1px;
    color: #1c1c1e;
  }
  #mono-proto-root { height: 100%; }
  .tnum { font-variant-numeric: tabular-nums; }
  button { font-family: inherit; }
  /* Text is selectable/copyable everywhere (pywebview's window also sets
     text_select=True). Controls opt out so button labels don't select. */
  html, body { -webkit-user-select: text; user-select: text; }
  button, .mono-close, .mono-tray { -webkit-user-select: none; user-select: none; }

  /* ── Motion — small, fast, consistent (150–220ms) ─────────────────────
     One easing curve everywhere; disabled entirely for reduced-motion. */
  @media (prefers-reduced-motion: no-preference) {
    @keyframes mono-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes mono-pop  { from { opacity: 0; transform: scale(0.985); }    to { opacity: 1; transform: none; } }
    @keyframes mono-fade { from { opacity: 0; }                             to { opacity: 1; } }
    .mono-rise { animation: mono-rise 0.2s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .mono-pop  { animation: mono-pop 0.16s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .mono-fade { animation: mono-fade 0.15s ease-out; }
    button { transition: background 0.12s, color 0.12s, opacity 0.12s, box-shadow 0.12s, transform 0.06s; }
    button:active:not(:disabled) { transform: scale(0.96); }
  }
  /* Input surfaces sharpen their border on focus */
  .mono-box, .mono-field { transition: box-shadow 0.15s; }
  .mono-box:focus-within, .mono-field:focus-within { box-shadow: inset 0 0 0 1px rgba(20,20,20,0.45) !important; }

  /* Hover states — uniform, subtle, warm.
     Flat layout: panels are square and joined; only controls have radii. */
  .mono-refl-card:hover { background: rgba(0,0,0,0.03); }
  .mono-refl-edit:hover { background: rgba(0,0,0,0.08) !important; }
  .mono-user-dock:hover { background: rgba(255,255,255,0.82) !important; }
  .mono-tray:hover { background: rgba(0,0,0,0.06); color: rgba(20,20,20,0.85) !important; }
  .mono-sb-item:not(.active):hover { background: rgba(0,0,0,0.045); }
  .mono-queue-row:hover { background: rgba(0,0,0,0.04) !important; }
  .mono-schedule-row:hover { background: rgba(0,0,0,0.03) !important; }
  .mono-close:hover { background: rgba(0,0,0,0.12) !important; }
  .mono-settings-tab:hover { background: rgba(0,0,0,0.04); }
  .mono-mode-card:hover { transform: translateY(-1px); }
  .mono-photo-select:hover { transform: translateY(-1px); }
  .mono-provider-card:not([data-active]):hover { background: rgba(255,255,255,0.78) !important; }
</style>
</head>
<body>
<div id="mono-proto-root"></div>

<!-- React / ReactDOM / Babel — vendored locally so the desktop app works
     offline and behind restrictive corporate / regional networks. -->
<script src="/static/vendor/react.development.js"></script>
<script src="/static/vendor/react-dom.development.js"></script>
<script src="/static/vendor/babel.min.js"></script>

<script type="text/babel" src="/static/jsx/api.js"></script>
<script type="text/babel" src="/static/jsx/icons.jsx"></script>
<script type="text/babel" src="/static/jsx/mono-theme.jsx"></script>
<script type="text/babel" src="/static/jsx/mono-shell.jsx"></script>
<script type="text/babel" src="/static/jsx/mono-modal-shell.jsx"></script>
<script type="text/babel" src="/static/jsx/mono-modals.jsx"></script>
<script type="text/babel" src="/static/jsx/mono-composer.jsx"></script>
<script type="text/babel" src="/static/jsx/mono-settings-hub.jsx"></script>
<script type="text/babel" src="/static/jsx/mono-prototype.jsx"></script>
</body>
</html>
